{% extends "base.html" %}
{% block title %}Log in · Connecto Library{% endblock %}
{% block content %}
<div class="login">
  <div class="brand big">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>Connecto Library</span>
  </div>
  <form method="post" action="/login" class="card form">
    <input type="hidden" name="next" value="{{ next }}">
    {% if error %}<div class="flash warn" role="alert">{{ error }}</div>{% endif %}
    <label>Username<input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Log in</button>
    <p class="muted small">Same username and password as the library server.</p>
  </form>
</div>
{% endblock %}
